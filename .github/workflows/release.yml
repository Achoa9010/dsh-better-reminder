name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node test.mjs
      - run: node pack.mjs
      - name: 生成 SHA256SUMS
        working-directory: dist
        run: sha256sum dsh-better_reminder-*.tgz dsh-better_reminder-plugin-*.zip > SHA256SUMS.txt
      - name: 创建 GitHub Release(资产 + 校验和)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## 安装

          本包已发布到 npm。方式一(web profile 推荐):`dsh plugin --profile web add dsh-better_reminder`。
          方式二(桌面端或手工):下载 `dsh-better_reminder-plugin-<version>.zip`(或 `.tgz`),按 README「安装」一节放入 profile 的 `node_modules\dsh-better_reminder\`(必须真实目录),并在 profile `package.json` 的 `dependencies` 与 `dsh.profile.bundles` 两处登记,重启 DSH。

          详见 [README](https://github.com/Achoa9010/dsh-better-reminder#readme) 与 [CHANGELOG](CHANGELOG.md)。
          资产完整性:见 SHA256SUMS.txt。
          EOF
          # 幂等:重打 tag(删 tag 不删 Release)时走 edit+upload --clobber,避免 create 撞已存在版本报错
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            # 删 tag 重推会把 Release 转为 draft,必须显式转正,否则公开不可见
            gh release edit "${{ github.ref_name }}" --draft=false \
              --title "dsh-better_reminder ${{ github.ref_name }}" \
              --notes-file /tmp/release-notes.md
            gh release upload "${{ github.ref_name }}" \
              dist/dsh-better_reminder-*.tgz \
              dist/dsh-better_reminder-plugin-*.zip \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${{ github.ref_name }}" \
              dist/dsh-better_reminder-*.tgz \
              dist/dsh-better_reminder-plugin-*.zip \
              dist/SHA256SUMS.txt \
              --title "dsh-better_reminder ${{ github.ref_name }}" \
              --notes-file /tmp/release-notes.md
          fi
